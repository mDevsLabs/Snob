name: 🚀 Deploy to Vercel via GitHub Actions

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

on:
  push:
    branches:
      - canary
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de déploiement (preview ou production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  Deploy-Production:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'production')
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: 🧹 Nettoyer le dossier .vercel résiduel
        run: rm -rf .vercel

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚡ Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 📥 Installation des dépendances
        run: npm ci

      - name: 🌍 Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}

      - name: 📦 Copy Vercel environment variables to root
        run: |
          touch .env.production.local

          if [ -f .vercel/.env.production.local ]; then
            cp .vercel/.env.production.local .env.production.local
            echo "✅ Variables d'environnement Vercel copiées vers .env.production.local"
          else
            echo "⚠️ Fichier .vercel/.env.production.local non trouvé"
          fi

      - name: 🏗️ Build Project Artifacts
        run: vercel build --prod --token=${{ env.VERCEL_TOKEN }}

      - name: 🌐 Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ env.VERCEL_TOKEN }}

  Deploy-Preview:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/canary') || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'preview')
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: 🧹 Nettoyer le dossier .vercel résiduel
        run: rm -rf .vercel

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚡ Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 📥 Installation des dépendances
        run: npm ci

      - name: 🌍 Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ env.VERCEL_TOKEN }}

      - name: 📦 Copy Vercel environment variables to root
        run: |
          touch .env.preview.local

          if [ -f .vercel/.env.preview.local ]; then
            cp .vercel/.env.preview.local .env.preview.local
            echo "✅ Variables d'environnement Vercel copiées vers .env.preview.local"
          else
            echo "⚠️ Fichier .vercel/.env.preview.local non trouvé"
          fi

      - name: 🏗️ Build Project Artifacts
        run: vercel build --token=${{ env.VERCEL_TOKEN }}

      - name: 🌐 Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --archive=tgz --token=${{ env.VERCEL_TOKEN }}